<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}IPv6 旧前缀地址核查{% endblock %}</title>
  <style>
    :root { --line:#d7dde5; --bg:#f5f7fa; --blue:#1f5fbf; --red:#b42318; --green:#067647; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: "Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;
           background:var(--bg); color:#1c2733; line-height:1.55; }
    header { background:#132a4a; color:#fff; padding:14px 24px; display:flex; gap:22px; align-items:center; flex-wrap:wrap; }
    header a { color:#cfe0ff; text-decoration:none; font-size:15px; }
    header a:hover { color:#fff; text-decoration:underline; }
    header b { font-size:17px; }
    main { max-width:1180px; margin:22px auto; padding:0 18px; }
    .card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:18px 20px; margin-bottom:20px; }
    h1 { font-size:20px; margin:0 0 14px; } h2 { font-size:16px; margin:0 0 12px; }
    table { border-collapse:collapse; width:100%; font-size:14px; }
    th,td { border:1px solid var(--line); padding:8px 10px; text-align:left; vertical-align:top; }
    th { background:#eef2f7; }
    input,select { padding:7px 9px; border:1px solid #b9c2cd; border-radius:6px; font-size:14px; width:100%; }
    label { font-size:13px; color:#46566b; display:block; margin-bottom:3px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px; }
    button { background:var(--blue); color:#fff; border:0; border-radius:7px; padding:9px 18px; font-size:14px; cursor:pointer; }
    button.secondary { background:#475569; }
    button.danger { background:var(--red); }
    .flash { border-radius:8px; padding:10px 14px; margin-bottom:10px; font-size:14px; }
    .flash.ok { background:#e7f6ee; color:var(--green); border:1px solid #aee3c6; }
    .flash.err { background:#fdeceb; color:var(--red); border:1px solid #f3c2bd; }
    .muted { color:#66768b; font-size:13px; }
    .tag { display:inline-block; padding:1px 8px; border-radius:99px; font-size:12px; }
    .tag.alive { background:#dcf5e6; color:var(--green); }
    .tag.gone { background:#eee; color:#5b6776; }
    .tag.snap { background:#e8eefc; color:var(--blue); }
    .rule { font-family:monospace; background:#eef2f7; padding:1px 6px; border-radius:5px; font-size:12px; }
    .rule.nochange { color:#7a8797; }
    code { background:#f0f2f5; padding:1px 5px; border-radius:4px; }
    form.inline { display:inline; }
  </style>
</head>
<body>
<header>
  <b>IPv6 换前缀 · 旧地址到期核查</b>
  <a href="{{ url_for('main.index') }}">核查结论</a>
  <a href="{{ url_for('main.setup') }}">本轮设置</a>
  <a href="{{ url_for('main.pio_form') }}">PIO 补报</a>
</header>
<main>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}<div class="flash {{ cat }}">{{ msg }}</div>{% endfor %}
  {% endwith %}
  {% block body %}{% endblock %}
</main>
</body>
</html>
